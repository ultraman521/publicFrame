//            storeFile file('../buildsystem/payapp.keystore')
//            storePassword '123456'
//        }
//        release {
//            keyAlias 'payapp'
//            keyPassword '123456'
//            storeFile file('../buildsystem/payapp.keystore')
//            storePassword '123456'
//        }
//    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation project(path: ':framework')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation project(path: ':mvvmhabit')

    implementation rootProject.ext.dependencies["SmartRefreshLayout"]
    implementation rootProject.ext.dependencies["FlycoRoundView_Lib"]
    implementation rootProject.ext.dependencies["BaseRecyclerViewAdapterHelper"]
    implementation rootProject.ext.dependencies["fresco-helper"]
    //动态更换请求URL
    implementation 'me.jessyan:retrofit-url-manager:1.4.0'
//    implementation rootProject.ext.dependencies["toast"]
}
